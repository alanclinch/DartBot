<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%}
/* game.css — Shared CSS for all DartBot games */

/* ── RESET ────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── THEME ────────────────────────────────────────────────── */
:root {
  --bg:#172c4e;
  --bg2:#1b3356;
  --surface:#213c66;
  --surface2:#274574;
  --border:#345878;
  --border2:#426892;
  --gold:#fcd34d;
  --gold-dim:#b45309;
  --text:#ffffff;
  --muted:#ffffff;
  --green:#34d399;
  --green2:#059669;
  --green3:#022c20;
  --red:#f87171;
  --red2:#991b1b;
  --amber:#fbbf24;
  --blue:#60a5fa;
  --blue2:#2563eb;
  --white:#ffffff;
  --cyan:#22d3ee;
}

body {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 8% 45%, rgba(75,45,165,.28) 0%, transparent 52%),
    radial-gradient(ellipse at 88% 55%, rgba(20,75,215,.22) 0%, transparent 52%);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  height: 100vh;
  overflow: hidden;
  user-select: none;
}

/* ── SCREEN SYSTEM ────────────────────────────────────────── */
.screen { display: none; width: 100vw; height: 100vh; }
.screen.active { display: flex; }

/* ── SCROLLBAR ────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

/* ── SETUP SCREEN ─────────────────────────────────────────── */
#setup {
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 32px 24px;
  overflow-y: auto;
  gap: 20px;
}
.setup-title {
  font-family: 'Orbitron', monospace;
  font-size: 42px; font-weight: 900;
  color: #fff;
  letter-spacing: 8px;
  flex-shrink: 0;
  padding-top: 8px;
}
.setup-title span { color: #fff; }

.setup-card {
  width: 100%; max-width: 760px;
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 16px;
  padding: 20px 24px;
  flex-shrink: 0;
  box-shadow: 0 12px 32px rgba(0,0,0,0.3);
}
.setup-card h3 {
  font-family: 'Orbitron', monospace;
  font-size: 16px; letter-spacing: 4px;
  color: #fff;
  text-transform: uppercase;
  margin-bottom: 16px;
}

/* ── VARIANT / RULES SELECTOR ─────────────────────────────── */
.variant-grid { display: flex; gap: 12px; flex-wrap: wrap; }
.variant-btn {
  flex: 1; min-width: 130px;
  padding: 14px 12px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 10px;
  color: var(--muted);
  font-family: 'Exo 2', sans-serif;
  font-size: 16px; font-weight: 700;
  cursor: pointer; transition: all .18s;
  text-align: center; letter-spacing: 1px;
}
.variant-btn:hover { border-color: var(--blue); color: var(--text); }
.variant-btn.sel { background: var(--blue2); border-color: var(--blue); color: var(--white); }
.variant-desc {
  margin-top: 12px; font-size: 16px; color: #fff;
  line-height: 1.6; min-height: 36px;
}

/* ── PLAYERS CARD ─────────────────────────────────────────── */
#player-list { display: flex; flex-direction: column; gap: 10px; }
.player-row {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 16px;
}
.flag-wrap { width: 42px; height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.player-row-name { font-size: 20px; font-weight: 700; color: var(--text); flex: 1; }
.player-row-badge {
  font-size: 12px; letter-spacing: 2px; font-weight: 800;
  padding: 4px 12px; border-radius: 12px;
}
.badge-human { background: rgba(80,144,224,.15); color: #fff; border: 1px solid rgba(80,144,224,.3); }
.badge-cpu { background: rgba(200,168,75,.15); color: #fff; border: 1px solid rgba(200,168,75,.3); }
.remove-btn {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-size: 28px; width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all .15s;
}
.remove-btn:hover { color: var(--red); background: rgba(224,72,72,.1); }

.add-btns { display: flex; gap: 12px; margin-top: 12px; }
.add-btn {
  flex: 1; padding: 16px;
  background: none; border: 2px dashed var(--border2);
  border-radius: 10px; color: var(--muted);
  font-family: 'Exo 2', sans-serif; font-size: 18px; font-weight: 700;
  cursor: pointer; transition: all .2s; letter-spacing: 1px;
}
.add-btn:hover { border-color: var(--blue); color: var(--blue); }
.add-btn:disabled { opacity: .3; cursor: not-allowed; }

/* ── RECENT PLAYERS ───────────────────────────────────────── */
.recent-players { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-height: 0; }
.recent-label { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.recent-chip {
  background: var(--surface2); border: 2px solid var(--border2);
  border-radius: 30px; padding: 12px 20px;
  color: var(--text); font-family: 'Exo 2', sans-serif;
  font-size: 16px; font-weight: 700; cursor: pointer;
  transition: all .15s; display: flex; align-items: center; gap: 6px;
}
.recent-chip:hover { border-color: var(--blue); color: var(--blue); }
.chip-stat { font-size: 14px; color: var(--muted); font-weight: 400; }

/* ── MODALS ───────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.85); backdrop-filter: blur(6px);
  z-index: 200; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-input {
  width: 100%; background: var(--surface); border: 2px solid var(--border2);
  color: var(--text); font-family: 'Exo 2', sans-serif; font-size: 18px; font-weight: 700;
  padding: 14px; border-radius: 10px; outline: none; margin-bottom: 16px;
}
.modal-input:focus { border-color: var(--blue); }
.cpu-modal-box {
  background: var(--bg2);
  border: 2px solid var(--border2);
  border-radius: 18px; padding: 28px;
  width: min(680px, 96vw); max-height: 85vh; overflow-y: auto;
}
.cpu-modal-box h2 {
  font-family: 'Orbitron', monospace; font-size: 16px;
  letter-spacing: 4px; color: #fff; margin-bottom: 20px;
}
.cpu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}
.cpu-pick-card {
  background: var(--surface); border: 2px solid var(--border2);
  border-radius: 12px; padding: 18px 14px;
  cursor: pointer; transition: all .18s;
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.cpu-pick-card:hover { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 8px 24px rgba(200,168,75,.2); }
.cpu-pick-name { font-size: 16px; font-weight: 800; color: var(--text); }
.cpu-pick-mpr { font-size: 14px; color: #fff; font-weight: 700; }
.cpu-mpr-bar { width: 90%; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.cpu-mpr-fill { height: 100%; background: linear-gradient(90deg, var(--blue2), var(--blue)); border-radius: 3px; }
.cpu-modal-cancel {
  margin-top: 20px; width: 100%; padding: 12px;
  background: none; border: 2px solid var(--border2);
  border-radius: 10px; color: var(--muted);
  font-family: 'Exo 2', sans-serif; font-size: 15px; font-weight: 700;
  cursor: pointer; transition: all .2s;
}
.cpu-modal-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── START BUTTON ─────────────────────────────────────────── */
.start-btn {
  width: 100%; max-width: 760px;
  padding: 20px;
  background: linear-gradient(135deg, #1e5090, #0f2e60);
  border: 2px solid #93c5fd;
  border-radius: 14px;
  color: var(--white);
  font-family: 'Orbitron', monospace;
  font-size: 22px; letter-spacing: 6px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 6px 0 #09152a, 0 0 28px rgba(96,165,250,.5), 0 12px 32px rgba(96,165,250,.3);
  transition: all .2s; flex-shrink: 0;
}
.start-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #09152a, 0 0 42px rgba(96,165,250,.65), 0 16px 42px rgba(96,165,250,.4); }
.start-btn:disabled { opacity: .28; cursor: not-allowed; transform: none; box-shadow: none; border-color: var(--border2); }

/* ── SETTINGS CARD ────────────────────────────────────────── */
.settings-grid {
  display: flex; flex-direction: row;
  justify-content: space-between;
  gap: 10px;
}
.setting-row {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; font-size: 14px; color: var(--muted);
  padding: 2px 0;
}
.setting-row input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--blue);
  cursor: pointer; flex-shrink: 0;
}
.setting-actions {
  display: flex; justify-content: center; gap: 32px;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.setting-action-btn {
  background: none; border: none;
  color: var(--white); opacity: .75;
  font-family: 'Exo 2', sans-serif; font-size: 13px; letter-spacing: 1px;
  cursor: pointer; padding: 4px 0;
  transition: opacity .15s, color .15s;
}
.setting-action-btn:hover { opacity: 1; color: var(--blue); }

/* ── STATS MODAL ──────────────────────────────────────────── */
.stats-modal-box {
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 18px;
  padding: 28px 24px 20px;
  width: min(680px, 96vw);
  max-height: 85vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.stats-modal-box h2 {
  font-family: 'Orbitron', monospace;
  color: var(--blue);
  letter-spacing: 4px;
  font-size: 18px;
  text-align: center;
}
.stats-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats-table th {
  font-family: 'Orbitron', monospace;
  font-size: 11px; letter-spacing: 2px;
  color: var(--muted); opacity: .7;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
}
.stats-table td {
  padding: 10px 10px;
  border-bottom: 1px solid rgba(44,77,114,.4);
  color: var(--text);
  vertical-align: middle;
}
.stats-table tbody tr:hover td { background: rgba(96,165,250,.05); }
.stats-rank { color: var(--muted); opacity: .5; font-size: 12px; width: 24px; }
.stats-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.stats-mpr { font-family: 'Share Tech Mono', monospace; color: var(--gold); font-size: 15px; font-weight: 700; }
.stats-empty { color: var(--muted); opacity: .6; text-align: center; padding: 32px 0; font-size: 14px; }

/* ── WS STATUS ────────────────────────────────────────────── */
.ws-row { display: flex; align-items: center; gap: 10px; }
.ws-dot { width: 12px; height: 12px; border-radius: 50%; background: #222; transition: background .3s; flex-shrink: 0; }
.ws-dot.on { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
.ws-label { font-size: 14px; color: var(--muted); }

/* ── WINNER SCREEN ────────────────────────────────────────── */
#winner { flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
.winner-layout {
  display: flex; flex-direction: column; align-items: center;
  gap: 16px; max-width: 760px; width: 92%; padding: 24px;
  overflow-y: auto; max-height: 100vh;
}
.win-card {
  background: var(--surface); border: 2px solid var(--gold);
  border-radius: 24px; padding: 56px 64px; text-align: center;
  animation: winPop .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 0 80px rgba(200,168,75,.25);
}
@keyframes winPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.win-trophy { font-size: 72px; margin-bottom: 16px; }
.win-label { font-family: 'Orbitron', monospace; font-size: 16px; letter-spacing: 6px; color: #fff; margin-bottom: 12px; }
.win-name { font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 900; color: #fff; }
.win-score { font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #fff; margin-top: 12px; }
#win-others { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; width: 100%; }
.win-other-card {
  background: var(--surface); border: 2px solid var(--border2);
  border-radius: 14px; padding: 16px 20px; text-align: center;
  flex: 1; min-width: 140px;
}
.win-other-name { font-size: 18px; font-weight: 700; color: var(--text); }
.win-other-score { font-size: 16px; color: #fff; margin-top: 6px; }
.win-buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; width: 100%; }
.win-btn {
  flex: 1; min-width: 160px;
  padding: 16px 20px;
  background: var(--surface); border: 2px solid var(--border2);
  border-radius: 12px; color: var(--text);
  font-family: 'Orbitron', monospace; font-size: 14px; letter-spacing: 3px;
  cursor: pointer; transition: all .2s;
}
.win-btn:hover { border-color: var(--blue); color: var(--blue); }
.win-btn-primary { background: linear-gradient(135deg, #1e5090, #0f2e60); border-color: var(--blue); color: var(--white); }
.win-btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(96,165,250,.35); }
.win-btn-danger:hover { border-color: var(--red); color: var(--red); }
.cpu-modal-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── ANNOUNCE OVERLAY ─────────────────────────────────────── */
#announce {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 300; pointer-events: none;
  font-family: 'Orbitron', monospace; font-weight: 900;
  font-size: 80px; line-height: 1;
  text-align: center;
  opacity: 0; transition: opacity .2s;
  text-shadow: 0 0 60px currentColor;
}
#announce.show { opacity: 1; }

/* ── CONFETTI ─────────────────────────────────────────────── */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.cf { position: absolute; top: -20px; animation: cfall linear infinite; }
@keyframes cfall {
  0%   { transform: translateY(0)     rotate(0deg);   opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ── BROADCAST EVENT OVERLAY ──────────────────────────────── */
#broadcast-event {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(.82);
  z-index: 320; pointer-events: none;
  width: min(940px, 88vw); min-height: 220px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 28px 42px; opacity: 0; color: #fff; text-align: center;
  font-family: 'Orbitron', monospace;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  background: linear-gradient(90deg, transparent, rgba(10,24,45,.92) 16%, rgba(10,24,45,.97) 84%, transparent);
  text-shadow: 0 0 34px currentColor;
  transition: opacity .15s ease, transform .28s cubic-bezier(.175,.885,.32,1.275);
}
#broadcast-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#broadcast-event.score { color: var(--gold); border-color: rgba(252,211,77,.8); }
#broadcast-event.open, #broadcast-event.close { color: var(--green); border-color: rgba(52,211,153,.85); }
#broadcast-event.dead, #broadcast-event.miss { color: var(--red); border-color: rgba(248,113,113,.72); }
.be-kicker { font-size: 18px; font-weight: 700; letter-spacing: 7px; text-transform: uppercase; margin-bottom: 12px; opacity: .92; }
.be-main { font-size: clamp(64px,9vw,140px); font-weight: 900; line-height: .95; letter-spacing: 2px; max-width: 100%; overflow-wrap: anywhere; }
.be-sub { margin-top: 16px; font-family: 'Exo 2', sans-serif; font-size: clamp(24px,3vw,44px); font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 0 24px rgba(255,255,255,.55); }

/* cricket.css — Cricket game screen styles */
/* Setup, modals, winner screen, and shared UI are in game.css */

/* ── GAME SCREEN ──────────────────────────────────────────── */
#game { flex-direction: row; height: 100vh; overflow: hidden; }

/* ═══════════════════════════════════════════════════════════
   ENHANCED GRAPHICS — "daylight broadcast" theme
   Designed for a 1920×1080 LCD in a bright room. Rules:
   - Solid accent bars with dark text (survive glare; glows don't)
   - Flat matte navy panels, no glass/translucency
   - Heavy condensed white type, readable at 3–4 m
   - Everything scoped under #game.enhanced-graphics; toggling the
     mode off must reproduce stock Cricket exactly.
   Winner-screen takeover lives at the bottom of this file under
   body.enhanced-winner (the one sanctioned body-level promotion).
   ═══════════════════════════════════════════════════════════ */
#game.enhanced-graphics {
  --ew-bg-hi: #182a45;
  --ew-bg-lo: #0c1626;
  --ew-panel: #16263d;
  --ew-panel-2: #1d3050;
  --ew-line: rgba(255,255,255,.16);
  --ew-amber: #ffb938;
  --ew-blue: #38b1ff;
  --ew-green: #3ddc6a;
  --ew-red: #ff4655;
  --ew-ink: #0a0c10;
  --ew-dim: rgba(214,228,242,.72);
  position: relative;
  display: block;
  padding: 86px 18px 74px;
  background: linear-gradient(180deg, var(--ew-bg-hi), var(--ew-bg-lo) 72%);
  color: #f7fbff;
}
/* CRITICAL: the id-specificity of `display:block` above beats `.screen{display:none}`,
   so without this the enhanced board stays visible after the leg ends and the winner
   screen renders off-screen below it (= "no end-game screen"). Re-hide when inactive. */
#game.enhanced-graphics:not(.active) { display: none; }

/* Hidden outside enhanced mode (markup is always present) */
.enhanced-topbar { display: none; }
.enhanced-player-stats { display: none; }

/* ── TOP BAR ── */
#game.enhanced-graphics .enhanced-topbar {
  position: absolute;
  top: 16px; left: 18px; right: 18px; height: 54px;
  display: grid;
  grid-template-columns: 1fr minmax(420px, 620px) 1fr;
  align-items: center;
  z-index: 4;
}
#game.enhanced-graphics .enhanced-brand {
  font-family: 'Exo 2', sans-serif;
  font-style: italic;
  font-weight: 900;
  font-size: 26px;
  letter-spacing: 0;
  line-height: 1;
}
#game.enhanced-graphics .enhanced-brand span:first-child { color: #fff; }
#game.enhanced-graphics .enhanced-brand span:nth-child(2) { color: var(--ew-amber); }
#game.enhanced-graphics .enhanced-brand small {
  display: block;
  margin-top: 5px;
  font: 700 11px 'Exo 2', sans-serif;
  font-style: normal;
  letter-spacing: 2px;
  color: var(--ew-dim);
}
#game.enhanced-graphics .enhanced-match-strip {
  height: 54px;
  display: grid;
  grid-template-columns: 1fr 200px 1fr;
  border: 1px solid var(--ew-line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--ew-panel);
}
#game.enhanced-graphics .enhanced-match-cell {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 2px;
  color: var(--ew-dim);
  font: 800 12px 'Exo 2', sans-serif;
  letter-spacing: 2px;
}
#game.enhanced-graphics .enhanced-match-cell strong {
  color: #fff;
  font-size: 20px;
  letter-spacing: 1px;
  line-height: 1.1;
}
#game.enhanced-graphics .enhanced-match-title {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ew-ink);
  font: 900 26px 'Exo 2', sans-serif;
  letter-spacing: 3px;
  background: var(--ew-amber);
}
#game.enhanced-graphics .enhanced-icons { display: none; }

/* ── SCOREBOARD FRAME ── */
#game.enhanced-graphics #scoreboard {
  position: relative;
  z-index: 2;
  height: calc(100vh - 160px);
  min-height: 540px;
  width: 100%;
  padding: 0;
  display: grid;
  grid-template-rows: 264px minmax(0, 1fr);
  row-gap: 14px;
  overflow: visible;
}
#game.enhanced-graphics .sb-top,
#game.enhanced-graphics .sb-body {
  display: grid;
  grid-template-columns: minmax(300px, 1fr) 340px minmax(300px, 1fr) !important;
  column-gap: 18px;
}
#game.enhanced-graphics .sb-top { margin: 0; align-items: stretch; gap: 18px; }
#game.enhanced-graphics .sb-num-label {
  visibility: hidden;  /* keeps its grid cell so the right card stays in col 3 */
  border: 0; background: transparent; box-shadow: none;
}

/* ── PLAYER CARDS ── */
#game.enhanced-graphics .sb-player-hdr {
  min-width: 0;
  position: relative;
  display: grid;
  grid-template-rows: 62px minmax(0, 1fr) 66px;
  grid-template-columns: 1fr;
  padding: 0;
  border-radius: 14px;
  border: 1px solid var(--ew-line);
  border-left: 6px solid var(--ew-amber);
  background: linear-gradient(180deg, var(--ew-panel-2), var(--ew-panel));
  overflow: hidden;
  transition: filter .25s;
  text-align: left;
  gap: 0;
}
#game.enhanced-graphics .sb-top .sb-player-hdr:last-child {
  border-left: 1px solid var(--ew-line);
  border-right: 6px solid var(--ew-blue);
}
#game.enhanced-graphics .sb-player-hdr:not(.active-col) {
  filter: brightness(.72) saturate(.6);
}
#game.enhanced-graphics .sb-player-hdr.active-col { transform: none; }
#game.enhanced-graphics .sb-active-dot,
#game.enhanced-graphics .sb-flag-corner { display: none; }

/* Name bar: solid accent, dark text — the daylight-proof element */
#game.enhanced-graphics .sb-pname {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 26px 6px;
  background: var(--ew-amber);
  color: var(--ew-ink);
  font: 900 clamp(24px, 2.1vw, 38px) 'Exo 2', sans-serif !important;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: .5px;
  white-space: nowrap;
  overflow: hidden;
  text-align: left;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 82%);
}
#game.enhanced-graphics .sb-top .sb-player-hdr:last-child .sb-pname {
  background: var(--ew-blue);
  justify-content: flex-end;
  clip-path: polygon(0 0, 100% 0, 100% 82%, 0 100%);
}
#game.enhanced-graphics .sb-player-hdr.active-col .sb-pname::after {
  content: "ON THROW";
  flex: none;
  margin-left: auto;
  background: var(--ew-ink);
  color: var(--ew-amber);
  font: 900 14px/1 'Exo 2', sans-serif;
  letter-spacing: 2px;
  padding: 8px 14px 7px;
  border-radius: 999px;
}
#game.enhanced-graphics .sb-top .sb-player-hdr:last-child.active-col .sb-pname::after {
  color: var(--ew-blue);
  margin-left: 0;
  margin-right: auto;
  order: -1;
}

/* Score: huge, white, centered */
#game.enhanced-graphics .sb-score-big {
  align-self: center;
  justify-self: center;
  margin: 0;
  font-family: 'Exo 2', sans-serif !important;
  font-weight: 900 !important;
  font-size: clamp(92px, 9.2vw, 176px) !important;
  line-height: .8;
  letter-spacing: -2px;
  color: #fff;
  text-shadow: 0 4px 0 rgba(0,0,0,.3);
  white-space: nowrap;
}
#game.enhanced-graphics .sb-score-big::after { content: none; }

/* MPR line is replaced by the stat strip */
#game.enhanced-graphics .sb-mpr { display: none !important; }

/* Stat strip: MPR | MARKS | CLOSED */
#game.enhanced-graphics .enhanced-player-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-self: stretch;
  width: 100%;
  border-top: 1px solid var(--ew-line);
  background: rgba(0,0,0,.28);
}
#game.enhanced-graphics .enhanced-player-stats div {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 3px;
  padding: 6px 0;
}
#game.enhanced-graphics .enhanced-player-stats div + div {
  border-left: 1px solid var(--ew-line);
}
#game.enhanced-graphics .enhanced-player-stats span {
  color: var(--ew-dim);
  font: 800 13px 'Exo 2', sans-serif;
  letter-spacing: 2px;
}
#game.enhanced-graphics .enhanced-player-stats strong {
  color: #fff;
  font: 700 clamp(22px, 1.9vw, 30px) 'Orbitron', monospace;
  line-height: 1.05;
}

/* ── CRICKET ROWS ── */
#game.enhanced-graphics .sb-body {
  flex: initial;
  overflow: visible;
  grid-auto-rows: minmax(0, 1fr);   /* rows stretch to fill full height */
  row-gap: 8px;
}
#game.enhanced-graphics .sb-row { display: contents; border: 0; }
#game.enhanced-graphics .sb-num-cell { display: none; }  /* sits behind the HUD anyway */

#game.enhanced-graphics .sb-mark-cell {
  min-height: 0;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 86px;
  align-items: stretch;
  border-radius: 10px;
  border: 1px solid var(--ew-line);
  background: var(--ew-panel);
  color: var(--ew-amber);          /* pips pick this up via currentColor */
  transition: background .2s, border-color .2s, opacity .2s;
}
#game.enhanced-graphics .sb-mark-cell[id$="-0"] { grid-column: 1; }
#game.enhanced-graphics .sb-mark-cell[id$="-1"] {
  grid-column: 3;
  grid-template-columns: 86px minmax(0, 1fr);
  color: var(--ew-blue);
}

/* Row number label, hugging the central HUD */
#game.enhanced-graphics .sb-mark-cell::before {
  content: attr(data-label);
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px solid var(--ew-line);
  color: #fff;
  font: 900 clamp(24px, 1.8vw, 34px) 'Exo 2', sans-serif;
  line-height: 1;
  padding: 0;
}
#game.enhanced-graphics .sb-mark-cell[id$="-1"]::before {
  grid-column: 1;
  border-left: 0;
  border-right: 1px solid var(--ew-line);
}
#game.enhanced-graphics .sb-mark-cell[data-label="BULL"]::before {
  font-size: clamp(14px, 1vw, 18px);
  letter-spacing: 1px;
}
#game.enhanced-graphics .mark-wrap {
  grid-column: 1;
  grid-row: 1;
  padding: 8px 14px;
}
#game.enhanced-graphics .sb-mark-cell[id$="-1"] .mark-wrap { grid-column: 2; }
#game.enhanced-graphics .mark-closed-line { display: none; }

/* Lamp pips: three solid blocks, lit left-to-right */
#game.enhanced-graphics .enhanced-mark-svg {
  display: block;
  width: min(170px, 88%);
  height: auto;
  max-height: 44px;
  margin: 0 auto;
}
#game.enhanced-graphics .enhanced-mark-svg rect.empty {
  fill: rgba(255,255,255,.05);
  stroke: rgba(255,255,255,.30);
  stroke-width: 2;
}
#game.enhanced-graphics .enhanced-mark-svg rect.filled {
  fill: currentColor;
  stroke: none;
}
#game.enhanced-graphics .enhanced-mark-svg.scoring rect.filled {
  fill: var(--ew-green);
}

/* Cell states */
#game.enhanced-graphics .sb-mark-cell.active-turn {
  background: linear-gradient(180deg, rgba(255,185,56,.12), rgba(255,185,56,.05)), var(--ew-panel);
  border-color: rgba(255,185,56,.42);
  box-shadow: none;
}
#game.enhanced-graphics .sb-mark-cell[id$="-1"].active-turn {
  background: linear-gradient(180deg, rgba(56,177,255,.12), rgba(56,177,255,.05)), var(--ew-panel);
  border-color: rgba(56,177,255,.42);
}
#game.enhanced-graphics .sb-mark-cell.is-scoring-cell {
  border-color: rgba(61,220,106,.55);
  box-shadow: inset 0 0 0 1px rgba(61,220,106,.25);
}
#game.enhanced-graphics .sb-mark-cell.pressure-cell {
  border-color: rgba(255,70,85,.6) !important;
  box-shadow: inset 0 0 0 1px rgba(255,70,85,.3);
}
#game.enhanced-graphics .sb-mark-cell.all-closed-cell {
  opacity: .42;
  color: var(--ew-red);
  border-color: var(--ew-line);
  box-shadow: none;
}
#game.enhanced-graphics .sb-mark-cell.all-closed-cell::before {
  color: var(--ew-red);
  text-decoration: line-through;
}

/* ── CENTRAL HUD COLUMN ── */
#game.enhanced-graphics #side-panel {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 86px;
  bottom: 74px;
  width: 340px;
  transform: translateX(-50%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto auto auto minmax(0, 1fr);
  gap: 12px;
  padding: 16px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--ew-panel-2), var(--ew-bg-lo));
  border: 1px solid var(--ew-line);
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}
#game.enhanced-graphics #side-panel > * { grid-column: 1 / -1; min-width: 0; min-height: 0; }
/* TARGET and ROUND share a row; keypad takes all leftover height */
#game.enhanced-graphics #side-panel > div:has(.turn-info)   { grid-row: 1; }
#game.enhanced-graphics #side-panel > div:has(.dart-slots)  { grid-row: 2; }
#game.enhanced-graphics #side-panel > div:has(.target-box)  { grid-row: 3; grid-column: 1; }
#game.enhanced-graphics #side-panel > div:has(.round-box)   { grid-row: 3; grid-column: 2; }
#game.enhanced-graphics #side-panel > .variant-badge        { grid-row: 4; }
#game.enhanced-graphics #side-panel > .keypad-wrap          { grid-row: 5; }

#game.enhanced-graphics .panel-label {
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--ew-dim);
  margin-bottom: 6px;
}
#game.enhanced-graphics .turn-info,
#game.enhanced-graphics .target-box,
#game.enhanced-graphics .round-box,
#game.enhanced-graphics .variant-badge,
#game.enhanced-graphics .keypad-wrap {
  background: rgba(255,255,255,.04);
  border: 1px solid var(--ew-line);
  border-radius: 10px;
  box-shadow: none;
}
#game.enhanced-graphics .turn-info { padding: 14px; }
#game.enhanced-graphics .turn-player {
  color: #fff;
  font: 900 30px 'Exo 2', sans-serif;
  text-transform: uppercase;
}
#game.enhanced-graphics .turn-player.cpu-turn { color: var(--ew-dim); }
#game.enhanced-graphics .turn-sub { color: var(--ew-dim); font-size: 16px; }

#game.enhanced-graphics .dart-slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
#game.enhanced-graphics .dart-slot {
  min-height: 62px;
  padding: 8px 6px;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--ew-line);
  border-radius: 8px;
}
#game.enhanced-graphics .dart-slot.hit    { border-color: var(--ew-blue); }
#game.enhanced-graphics .dart-slot.scored { border-color: var(--ew-amber); }
#game.enhanced-graphics .dart-slot.miss   { border-color: var(--ew-red); }
#game.enhanced-graphics .dart-slot-label { font-size: 12px; letter-spacing: 1.5px; }
#game.enhanced-graphics .dart-slot-val {
  width: auto;
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
}

#game.enhanced-graphics .target-box,
#game.enhanced-graphics .round-box { padding: 10px; }
#game.enhanced-graphics .target-box { border-color: rgba(255,185,56,.5); }
#game.enhanced-graphics .target-label,
#game.enhanced-graphics .round-sub { font-size: 12px; letter-spacing: 2px; color: var(--ew-dim); }
#game.enhanced-graphics .target-val {
  color: var(--ew-amber);
  font-size: clamp(38px, 2.7vw, 50px);
  margin-top: 2px;
}
#game.enhanced-graphics .round-num {
  color: #fff;
  font-size: clamp(38px, 2.7vw, 50px);
}

#game.enhanced-graphics .variant-badge {
  letter-spacing: 4px;
  font-size: 13px;
  color: var(--ew-dim);
  padding: 9px;
}

/* Keypad absorbs all remaining vertical space — big touch targets */
#game.enhanced-graphics .keypad-wrap {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  margin-top: 0;
}
#game.enhanced-graphics .keypad-row { flex: 1; display: flex; gap: 8px; }
#game.enhanced-graphics .kp-btn {
  height: 100%;
  min-height: 34px;
  padding: 0;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--ew-line);
  border-radius: 8px;
  color: #fff;
  font-size: clamp(18px, 1.3vw, 25px);
  font-weight: 800;
}
#game.enhanced-graphics .kp-mod,
#game.enhanced-graphics .kp-undo { font-size: 17px; }
#game.enhanced-graphics .kp-btn:hover { border-color: var(--ew-blue); color: var(--ew-blue); }
#game.enhanced-graphics .kp-miss { color: var(--ew-dim); }
#game.enhanced-graphics .kp-miss:hover { border-color: var(--ew-red); color: var(--ew-red); }
#game.enhanced-graphics .kp-mod.active {
  background: var(--ew-amber);
  border-color: var(--ew-amber);
  color: var(--ew-ink);
  box-shadow: none;
}
#game.enhanced-graphics .kp-undo { border-color: rgba(255,185,56,.55); color: var(--ew-amber); }

#game.enhanced-graphics .end-btn {
  padding: 10px;
  border: 1px solid var(--ew-line);
  border-radius: 8px;
  background: rgba(255,255,255,.03);
  color: var(--ew-dim);
  /* !important: RESET/CALIBRATE carry inline font-size:11px in the HTML */
  font-size: 14px !important;
}
#game.enhanced-graphics .end-btn:hover { border-color: var(--ew-red); color: var(--ew-red); }

/* WS status: thin strip below the board */
#game.enhanced-graphics .game-ws {
  position: absolute;
  left: 50%;
  bottom: -58px;
  transform: translateX(-50%);
  width: calc(100vw - 40px);
  height: 44px;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--ew-panel);
  border: 1px solid var(--ew-line);
  border-radius: 10px;
}

/* ── SMALL SCREENS (functional fallback, not the target display) ── */
@media (max-width: 980px) {
  #game.enhanced-graphics {
    padding: 78px 10px 14px;
    overflow: auto;
  }
  #game.enhanced-graphics .enhanced-topbar {
    left: 10px; right: 10px;
    grid-template-columns: 1fr;
  }
  #game.enhanced-graphics .enhanced-brand { display: none; }
  #game.enhanced-graphics #scoreboard {
    min-height: 0;
    height: auto;
    grid-template-rows: 170px auto;
  }
  #game.enhanced-graphics .sb-top,
  #game.enhanced-graphics .sb-body {
    grid-template-columns: minmax(130px, 1fr) 96px minmax(130px, 1fr) !important;
    column-gap: 8px;
  }
  #game.enhanced-graphics .sb-player-hdr { grid-template-rows: 40px 1fr 40px; }
  #game.enhanced-graphics .sb-pname { padding: 0 12px 4px; font-size: 16px !important; }
  #game.enhanced-graphics .sb-player-hdr.active-col .sb-pname::after { display: none; }
  #game.enhanced-graphics .sb-score-big { font-size: 56px !important; }
  #game.enhanced-graphics .sb-mark-cell { grid-template-columns: minmax(0,1fr) 44px; }
  #game.enhanced-graphics .sb-mark-cell[id$="-1"] { grid-template-columns: 44px minmax(0,1fr); }
  #game.enhanced-graphics .sb-mark-cell::before { font-size: 16px; }
  #game.enhanced-graphics .mark-wrap { padding: 4px 6px; }
  #game.enhanced-graphics #side-panel {
    position: relative;
    inset: auto;
    transform: none;
    width: 100%;
    margin-top: 12px;
    bottom: auto;
  }
  #game.enhanced-graphics .game-ws {
    position: static;
    transform: none;
    width: auto;
    height: auto;
    padding: 8px;
  }
}

/* ── SCOREBOARD ───────────────────────────────────────────── */
#scoreboard {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 16px 12px 12px 16px;
  overflow: hidden;
  min-width: 0;
}

.sb-top {
  display: grid;
  margin-bottom: 8px;
  gap: 4px;
}

.sb-num-label {
  font-family: 'Orbitron', monospace;
  font-size: 14px; letter-spacing: 3px; color: var(--muted);
  display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 6px;
}
.sb-player-hdr {
  display: flex; flex-direction: column; align-items: center;
  position: relative;
  padding: 14px 10px 10px;
  border-radius: 12px 12px 0 0;
  border: 2px solid transparent;
  border-bottom: 4px solid transparent;
  transition: all .25s;
  gap: 4px;
  text-align: center;
}
.sb-flag-corner {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 18px;
  display: flex; align-items: center; justify-content: center;
}
.sb-player-hdr.active-col {
  background: rgba(96,165,250,.12);
  border-color: rgba(96,165,250,.3);
  border-bottom-color: var(--blue);
}
.sb-active-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue); box-shadow: 0 0 10px var(--blue);
  opacity: 0; transition: opacity .25s;
}
.sb-player-hdr.active-col .sb-active-dot { opacity: 1; }
.sb-score-big {
  font-family: 'Orbitron', monospace; font-weight: 900;
  color: #fff; line-height: 1;
}
.sb-score-big.leading { color: #fff; }
.sb-mpr { font-family: 'Share Tech Mono', monospace; color: #fff; line-height: 1; }
.sb-pname {
  font-size: 20px; font-weight: 800;
  color: #fff; letter-spacing: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  width: 100%; text-align: center;
}

/* ── SCOREBOARD ROWS ──────────────────────────────────────── */
.sb-body { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.sb-row {
  display: grid;
  align-items: stretch;
  gap: 4px;
  flex: 1;
  border-bottom: 2px solid rgba(30,50,80,.4);
}
.sb-row:last-child { border-bottom: none; }

.sb-num-cell {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Orbitron', monospace; font-weight: 700;
  color: #fff;
}
.sb-num-cell.num-closed-all { color: var(--red); text-decoration: line-through; }
.bull-svg { width: min(75%, 56px); height: auto; }

.sb-mark-cell {
  display: flex; align-items: center; justify-content: center;
  position: relative;
  background: var(--surface);
  border-radius: 6px;
  border: 2px solid transparent;
  transition: all .2s;
}
.sb-mark-cell.active-turn { background: rgba(96,165,250,.06); border-color: var(--blue2); }
.sb-mark-cell.is-scoring-cell { background: rgba(52,211,153,.18); border-color: rgba(52,211,153,.6); }
.sb-mark-cell.is-scoring-cell.active-turn { background: rgba(52,211,153,.3); border-color: var(--green); }
.sb-mark-cell.all-closed-cell { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.5); }
.sb-mark-cell.just-hit { animation: cellFlash .5s ease-out; }
@keyframes cellFlash {
  0%   { background: rgba(200,230,255,.5); }
  100% { background: var(--surface); }
}
.sb-mark-cell.just-scored { animation: cellScore .5s ease-out; }
@keyframes cellScore {
  0%   { background: rgba(240,160,48,.4); }
  100% { background: var(--surface); }
}
.sb-mark-cell.just-closed { animation: cellClose .85s ease-out; }
@keyframes cellClose {
  0%   { transform: scale(1);     background: rgba(52,211,153,.15); box-shadow: none; }
  35%  { transform: scale(1.035); background: rgba(52,211,153,.42); box-shadow: 0 0 34px rgba(52,211,153,.48); }
  100% { transform: scale(1);     background: var(--surface);       box-shadow: none; }
}
.sb-mark-cell.pressure-cell {
  border-color: var(--gold) !important;
  box-shadow: inset 0 0 0 2px rgba(252,211,77,.22), 0 0 22px rgba(252,211,77,.12);
}
.sb-mark-cell.closed-col { background: rgba(96,165,250,.08); }

.mark-wrap {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  padding: 6px 12px;
  position: relative;
}
.mark-closed-line {
  position: absolute;
  left: 15%; right: 15%;
  height: 3px;
  background: var(--blue);
  top: 50%; transform: translateY(-50%);
  opacity: 0; transition: opacity .3s;
}
.mark-closed-line.visible { opacity: 1; }
.mark-closed-line.scoring-line { background: var(--green); }
.mark-svg-wrap {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
}

/* ── SIDE PANEL ───────────────────────────────────────────── */
#side-panel {
  width: 260px; flex-shrink: 0;
  background: var(--surface);
  border-left: 2px solid var(--border2);
  display: flex; flex-direction: column;
  padding: 16px; gap: 16px; overflow: hidden;
}
.panel-label {
  font-family: 'Orbitron', monospace;
  font-size: 14px; letter-spacing: 4px; color: var(--muted);
  text-transform: uppercase; margin-bottom: 8px;
}

/* ── DART SLOTS ───────────────────────────────────────────── */
.dart-slots { display: flex; gap: 8px; flex-direction: column; }
.dart-slot {
  flex: 1;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px 6px;
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 16px; color: var(--muted);
  min-height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  transition: all .25s;
}
.dart-slot.hit { border-color: var(--blue); color: #fff; background: rgba(96,165,250,.08); }
.dart-slot.scored { border-color: var(--gold); color: #fff; background: rgba(200,168,75,.12); }
.dart-slot.miss { border-color: var(--red2); color: #fff; }
.dart-slot-label { font-size: 14px; color: var(--muted); letter-spacing: 2px; }
.dart-slot-val { font-size: 24px; font-weight: 700; line-height: 1.1; width: 60%; text-align: right; }

/* ── TURN INFO ────────────────────────────────────────────── */
.turn-info {
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; padding: 16px; text-align: center;
}
.turn-player { font-size: 24px; font-weight: 800; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.turn-player.cpu-turn { color: #fff; }
.turn-sub { font-size: 14px; color: var(--muted); margin-top: 6px; }

/* ── TARGET BOX ───────────────────────────────────────────── */
.target-box {
  background: rgba(14,35,80,.5);
  border: 2px solid var(--blue2);
  border-radius: 10px; padding: 16px;
  text-align: center;
}
.target-label { font-size: 12px; letter-spacing: 3px; color: var(--muted); }
.target-val { font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 900; color: #fff; margin-top: 6px; }

/* ── ROUND BOX ────────────────────────────────────────────── */
.round-box {
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; padding: 12px; text-align: center;
}
.round-num { font-family: 'Orbitron', monospace; font-size: 48px; font-weight: 900; color: var(--white); }
.round-sub { font-size: 12px; color: var(--muted); letter-spacing: 3px; }

/* ── WS STATUS (GAME) ─────────────────────────────────────── */
.game-ws { display: flex; align-items: center; gap: 8px; margin-top: auto; }

/* ── VARIANT BADGE ────────────────────────────────────────── */
.variant-badge {
  text-align: center;
  font-family: 'Orbitron', monospace; font-size: 12px;
  letter-spacing: 3px; color: var(--muted);
  padding: 8px;
  border: 2px solid var(--border); border-radius: 8px;
}

/* ── MANUAL KEYPAD ────────────────────────────────────────── */
.keypad-wrap {
  display: flex; flex-direction: column; gap: 6px;
  background: var(--surface2); border: 2px solid var(--border);
  border-radius: 10px; padding: 10px;
}
.keypad-row { display: flex; gap: 6px; }
.kp-btn {
  flex: 1; padding: 8px 0; background: var(--surface);
  border: 2px solid var(--border2); border-radius: 6px;
  color: var(--text); font-family: 'Exo 2', sans-serif;
  font-size: 14px; font-weight: 700; cursor: pointer; transition: all .15s;
}
.kp-btn:hover { border-color: var(--blue); color: var(--blue); }
.kp-miss { color: var(--muted); }
.kp-miss:hover { border-color: var(--red); color: var(--red); }
.kp-mod.active { background: var(--blue2); border-color: var(--blue); color: var(--white); }
.kp-undo { border-color: var(--amber); color: #fff; }
.kp-undo:hover { background: rgba(251,191,36,.1); border-color: var(--amber); }

/* ── END GAME BUTTON ──────────────────────────────────────── */
.end-btn {
  padding: 14px; background: none;
  border: 2px solid var(--border2); border-radius: 10px;
  color: var(--muted); font-family: 'Exo 2', sans-serif;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all .2s; letter-spacing: 1px;
}
.end-btn:hover { border-color: var(--red); color: var(--red); }

/* ── TEST SUITE ───────────────────────────────────────────── */
.test-preset-row {
  display: flex; gap: 14px; align-items: center;
  padding: 14px 16px;
  border: 2px solid var(--border2);
  border-radius: 10px;
  background: var(--surface2);
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.test-preset-row:hover { border-color: var(--blue); }
.test-preset-row.sel { border-color: var(--blue); background: rgba(96,165,250,.08); }
.test-preset-row input { accent-color: var(--blue); }
.test-preset-name {
  font-family: 'Orbitron', monospace; font-weight: 800;
  color: var(--white); font-size: 18px; letter-spacing: 1px;
}
.test-preset-blurb { font-size: 13px; color: var(--muted); margin-top: 4px; }

#test-progress-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 700;
  background: rgba(0,0,0,.86);
  align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
.tp-card {
  background: var(--surface);
  border: 2px solid var(--border2);
  border-radius: 16px;
  padding: 36px 48px;
  min-width: 420px;
  text-align: center;
}
.tp-label {
  font-family: 'Orbitron', monospace; font-size: 12px;
  letter-spacing: 4px; color: var(--muted);
  margin-bottom: 14px;
}
.tp-count {
  font-family: 'Orbitron', monospace; font-weight: 900;
  font-size: 48px; color: var(--white); line-height: 1;
}
.tp-pct {
  font-family: 'Share Tech Mono', monospace;
  font-size: 16px; color: var(--blue);
  margin-top: 8px;
}
.tp-bar {
  width: 100%; height: 8px;
  background: var(--bg2);
  border-radius: 4px; overflow: hidden;
  margin: 18px 0 14px;
}
.tp-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--green));
  width: 0%; transition: width .2s;
}
.tp-match {
  font-family: 'Exo 2', sans-serif;
  font-size: 14px; color: var(--muted);
}

.test-table {
  width: 100%; border-collapse: collapse;
  font-family: 'Exo 2', sans-serif;
}
.test-table th, .test-table td {
  padding: 8px 10px;
  text-align: right;
  font-size: 13px;
  border-bottom: 1px solid var(--border2);
}
.test-table th {
  font-family: 'Orbitron', monospace;
  font-size: 11px; letter-spacing: 1.5px;
  color: var(--muted); text-transform: uppercase;
}
.test-table .tc-name { text-align: left; color: var(--white); font-weight: 700; }
.test-table .tc-good { color: var(--green); }
.test-table .tc-warn { color: var(--amber); }
.test-table .tc-bad  { color: var(--red); }
.test-complete-meta {
  margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--border2);
  font-family: 'Share Tech Mono', monospace;
  font-size: 12px; color: var(--muted); text-align: center;
}
.test-complete-meta code {
  background: var(--bg2); padding: 1px 6px;
  border-radius: 4px; color: var(--blue);
}

/* ── ARCADE ROUND SPLASH ──────────────────────────────────── */
#arcade-round-splash {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(0,0,0,.92);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px;
}
#arcade-round-splash.show { display: flex; }
#arcade-round-text {
  font-family: 'Orbitron', monospace;
  font-size: clamp(72px, 14vw, 160px); font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 80px rgba(240,192,64,.7), 0 8px 0 var(--gold-dim);
  letter-spacing: 6px; text-align: center;
  animation: arcadeWaveIn .5s cubic-bezier(.34,1.56,.64,1) forwards;
}
#arcade-round-vs {
  font-family: 'Orbitron', monospace;
  font-size: clamp(18px, 3vw, 36px);
  color: #fff; letter-spacing: 5px; opacity: .8;
  animation: arcadeWaveIn .5s .15s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes arcadeWaveIn {
  from { opacity: 0; transform: scale(.4); }
  to   { opacity: 1; transform: scale(1); }
}

/* ═══════════════════════════════════════════════════════════
   ENHANCED WINNER TAKEOVER
   Applied via body.enhanced-winner (set by cricket.js only when
   Enhanced Graphics is active for the finished leg). ew-p1 marks
   the right/blue player as the winner; default accent is amber.
   Pure visual overrides of the standard winner screen — removing
   the class restores the stock look exactly.
   ═══════════════════════════════════════════════════════════ */
body.enhanced-winner #winner {
  position: relative;
  overflow: hidden;
  background: linear-gradient(180deg, #182a45, #0c1626 72%);
}
/* Spotlight behind the champion */
body.enhanced-winner #winner::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 70% 55% at 50% 22%, rgba(255,185,56,.26), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
}
body.enhanced-winner.ew-p1 #winner::before {
  background:
    radial-gradient(ellipse 70% 55% at 50% 22%, rgba(56,177,255,.3), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.03) 0 2px, transparent 2px 26px);
}
/* Light-sweep beam that animates across on entry */
body.enhanced-winner #winner::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0; left: -40%;
  width: 40%;
  pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.06), transparent);
  animation: ewSweep 1.1s .15s ease-out both;
}
@keyframes ewSweep { from { left: -40%; } to { left: 120%; } }
/* Themed single column — same structure and scroll behaviour as normal mode
   (the user wants the familiar add/remove-players flow), just restyled. The
   stock .winner-layout already scrolls (overflow-y:auto, max-height:100vh) so
   the roster + buttons always stay reachable; we only theme it and size the
   hero down so nothing gets pushed off-screen. */
body.enhanced-winner .winner-layout {
  position: relative;
  z-index: 1;
  max-width: 820px;
}
body.enhanced-winner .win-card {
  background: transparent;
  border: 0;
  box-shadow: none;
  border-radius: 0;
  padding: 28px 0 10px;
  animation: none;
}
body.enhanced-winner .win-label {
  display: inline-block;
  background: #ffb938;
  color: #0a0c10;
  font: 900 18px 'Exo 2', sans-serif;
  letter-spacing: 8px;
  text-indent: 8px;      /* visually recentres letter-spaced caps */
  padding: 11px 26px 10px;
  border-radius: 4px;
  margin-bottom: 22px;
  transform: skewX(-8deg);
  box-shadow: 0 6px 22px rgba(255,185,56,.34);
  animation: ewKick .45s cubic-bezier(.22,1,.36,1) both;
}
body.enhanced-winner.ew-p1 .win-label {
  background: #38b1ff;
  box-shadow: 0 6px 22px rgba(56,177,255,.4);
}
/* Trophy returns as a themed accent above the name */
body.enhanced-winner .win-trophy {
  display: block;
  font-size: 46px;
  margin-bottom: 2px;
  filter: drop-shadow(0 4px 14px rgba(255,185,56,.5));
  animation: ewName .5s cubic-bezier(.22,1,.36,1) both;
}
body.enhanced-winner .win-name {
  font-family: 'Exo 2', sans-serif;
  font-weight: 900;
  font-size: clamp(52px, 5.5vw, 96px);  /* big hero, but leaves room for the roster + buttons */
  line-height: .92;
  text-transform: uppercase;
  letter-spacing: -1px;
  color: #fff;
  text-shadow: 0 6px 0 rgba(0,0,0,.32);
  animation: ewName .55s .12s cubic-bezier(.22,1,.36,1) both;
}
body.enhanced-winner .win-name::after {
  content: "";
  display: block;
  width: 34%;
  height: 8px;
  margin: 14px auto 0;
  background: #ffb938;
  transform: skewX(-8deg);
}
body.enhanced-winner.ew-p1 .win-name::after { background: #38b1ff; }
body.enhanced-winner .win-score {
  color: rgba(222,234,246,.9);
  font-size: 20px;
  margin-top: 16px;
  animation: ewUp .5s .3s cubic-bezier(.22,1,.36,1) both;
}
body.enhanced-winner #win-others,
body.enhanced-winner #win-session,
body.enhanced-winner .winner-layout .setup-card,
body.enhanced-winner .win-buttons {
  animation: ewUp .5s .42s cubic-bezier(.22,1,.36,1) both;
}
body.enhanced-winner .win-other-card {
  background: #16263d;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 10px;
}
/* inline color:var(--blue) on #win-session needs !important to override */
body.enhanced-winner #win-session { color: #ffb938 !important; }
body.enhanced-winner.ew-p1 #win-session { color: #38b1ff !important; }
body.enhanced-winner .winner-layout .setup-card {
  background: #121f33;
  border: 1px solid rgba(255,255,255,.14);
}
body.enhanced-winner .win-btn {
  background: #16263d;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 10px;
  color: #f7fbff;
}
body.enhanced-winner .win-btn-primary {
  background: #ffb938;
  border-color: #ffb938;
  color: #0a0c10;
  font-weight: 700;
}
body.enhanced-winner.ew-p1 .win-btn-primary {
  background: #38b1ff;
  border-color: #38b1ff;
}
body.enhanced-winner .win-btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  filter: brightness(1.08);
}
@keyframes ewKick {
  from { opacity: 0; transform: translateY(-34px) skewX(-8deg); }
  to   { opacity: 1; transform: translateY(0) skewX(-8deg); }
}
@keyframes ewName {
  from { opacity: 0; transform: scale(.86) translateY(20px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes ewUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@media (max-width: 980px) {
  body.enhanced-winner .win-name { font-size: clamp(44px, 10vw, 80px); }
}

/* ── RESET / CALIBRATE 3s progress feedback ── */
.end-btn.board-btn.busy {
  color: #fff !important;
  border-color: var(--blue) !important;
  /* blue fill sweeps left→right over 3s (matches backend time) */
  background: linear-gradient(90deg, rgba(96,165,250,.42), rgba(96,165,250,.42)) left center / 0% 100% no-repeat;
  animation: boardFill 3s linear forwards;
  cursor: default;
}
@keyframes boardFill { to { background-size: 100% 100%; } }
.end-btn.board-btn.done {
  color: var(--green) !important;
  border-color: var(--green) !important;
}

/* ── WS ACTIVITY PULSE ── dot flashes green on each board message ── */
.ws-dot.flash { animation: wsFlash .5s ease-out; }
@keyframes wsFlash {
  0%   { transform: scale(1);   box-shadow: 0 0 0 0 rgba(52,211,153,.75); }
  45%  { transform: scale(1.7); box-shadow: 0 0 10px 3px rgba(52,211,153,.55); }
  100% { transform: scale(1);   box-shadow: 0 0 0 0 rgba(52,211,153,0); }
}

/* ── VERSION BADGE ── small, muted, never blocks clicks ── */
#version-badge {
  position: fixed;
  right: 7px;
  bottom: 5px;
  z-index: 50;
  pointer-events: none;
  user-select: none;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.34);
}
</style>
</head>
<body class="enhanced-winner">
<div id="winner" class="screen active">
    <div class="winner-layout">
      <div class="win-card" style="width:100%;">
        <div class="win-trophy">🏆</div>
        <div class="win-label">WINNER</div>
        <div class="win-name">ROB</div>
        <div class="win-score">Leg 2 · Score 68<br><span style="font-size:14px;">45 darts · 34 marks · 15 rounds · MPR 2.27</span></div>
      </div>
      <div id="win-others"><div class="win-other-card"><div class="win-other-name">TAYLOR</div>
        <div class="win-other-score">Score 61</div>
        <div class="win-other-score" style="font-size:13px;margin-top:4px;">45 darts · 33 marks · 15 rounds · MPR 2.20</div></div></div>
      <div id="win-session" style="color:var(--blue);font-family:'Orbitron',monospace;font-size:14px;letter-spacing:1px;text-align:center;padding:8px 0;">Series: ROB 2 – 1 TAYLOR</div>
      <div class="setup-card" style="width:100%;margin-top:4px;">
        <h3>Next Match Roster</h3>
        <div id="player-list-winner"><div class="player-row"><div class="flag-wrap"><svg viewBox="0 0 60 40" style="width:100%;height:100%;border-radius:4px;"><rect width="60" height="40" fill="#005eb8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="6"/></svg></div>
      <div class="player-row-name">ROB</div>
      <div class="player-row-badge badge-human">HUMAN</div><button class="remove-btn">✕</button></div><div class="player-row"><div class="flag-wrap"><svg viewBox="0 0 60 40" style="width:100%;height:100%;border-radius:4px;"><rect width="60" height="40" fill="#fff"/><path d="M30,0 L30,40 M0,20 L60,20" stroke="#ce1126" stroke-width="8"/></svg></div>
      <div class="player-row-name">TAYLOR</div>
      <div class="player-row-badge badge-human">HUMAN</div><button class="remove-btn">✕</button></div></div>
        <div class="add-btns"><button class="add-btn add-human-btn">+ Human Player</button><button class="add-btn add-cpu-btn">+ Computer Player</button></div>
      </div>
      <div class="win-buttons">
        <button class="win-btn win-btn-primary" style="font-size:18px;padding:20px;">PLAY NEXT LEG</button>
        <button class="win-btn" style="border-color:var(--amber);color:var(--amber);">↩ BACK TO GAME</button>
        <button class="win-btn win-btn-danger">MENU</button>
      </div>
    </div>
  </div>
</body></html>
